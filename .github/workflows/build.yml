name: Build
on:
  push:
    branches:
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Validate Jest coverage scope
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const list=(pkg.jest&&pkg.jest.collectCoverageFrom)||[];const banned=['!modules/factory/**','!libs/quidax/**','!libs/nomba/**','!libs/dojah/**','!modules/scheduler/**','!modules/core/logger/**','!modules/api/auth/**','modules/api/auth/errors/**/*.ts','!modules/api/kyc/**','!modules/api/session/**','!modules/api/trade/services/webhook-handlers/**','!modules/api/trade/crons/**','!modules/api/trade/services/buy-order.service.ts','!modules/api/trade/services/websocket.service.ts','!modules/api/trade/queues/processors/**'];const found=banned.filter((item)=>list.includes(item));if(found.length){console.error('Disallowed Jest coverage exclusions detected:\n'+found.join('\n'));process.exit(1);}console.log('Jest coverage scope validation passed.');"

      - name: Generate coverage report
        timeout-minutes: 10
        continue-on-error: true
        env:
          NODE_ENV: test
        run: pnpm exec jest --coverage --passWithNoTests --runInBand --detectOpenHandles --forceExit

      - name: SonarQube Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
