<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>{{header}}</title>
    <style>
        :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
        }

        @media (prefers-color-scheme: dark) {
            .wrapper {
                background-color: #1a1a1a !important;
            }

            .container {
                background-color: #2d2d2d !important;
            }

            .amount-box {
                background-color: #3d3d3d !important;
                border-color: #4d4d4d !important;
            }

            .amount-value {
                color: #ffffff !important;
            }

            .message,
            .amount-fiat,
            .footer-text {
                color: #b3b3b3 !important;
            }

            .cta-button {
                color: #ffffff !important;
            }
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f5;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #020202;
            -webkit-text-size-adjust: 100%;
        }

        .wrapper {
            width: 100%;
            background-color: #f4f4f5;
            padding: 40px 16px;
        }

        .container {
            max-width: 595px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 28px rgba(222, 222, 222, 0.25);
        }

        .header {
            text-align: center;
            padding: 32px 24px 24px;
            border-bottom: 3px solid #305DC9;
        }

        .logo {
            width: 140px;
            height: auto;
        }

        .content {
            padding: 28px;
        }

        .amount-box {
            background-color: #f4f4f5;
            border: 2px solid #e1e4ea;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount-label {
            color: #aaabac;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .amount-value {
            font-size: 36px;
            font-weight: 700;
            color: #020202;
            margin-bottom: 8px;
        }

        .amount-fiat {
            color: #5a5b5b;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-completed {
            background-color: #e7feec;
            color: #099528;
            border: 2px solid #09952840;
        }

        .status-pending,
        .status-processing {
            background-color: #95600918;
            color: #956009;
            border: 2px solid #95600940;
        }

        .status-failed {
            background-color: #e40e0e18;
            color: #e40e0e;
            border: 2px solid #e40e0e40;
        }

        .status-cancelled,
        .status-reversed {
            background-color: #e40e0e18;
            color: #e40e0e;
            border: 2px solid #e40e0e40;
        }

        .message {
            font-size: 16px;
            color: #020202;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .sub-message {
            font-size: 14px;
            color: #5a5b5b;
            margin-bottom: 0;
            line-height: 1.5;
        }

        .cta-button {
            display: inline-block;
            background-color: #305DC9;
            color: #ffffff !important;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .footer {
            border-top: 3px solid #305DC9;
            padding: 24px;
            text-align: center;
        }

        .footer-logo {
            width: 90px;
            height: auto;
            margin-bottom: 12px;
        }

        .footer-text {
            color: #5a5b5b;
            font-size: 12px;
            margin: 0 0 6px;
        }

        .footer-copyright {
            color: #aaabac;
            font-size: 11px;
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="wrapper" style="width: 100%; background-color: #f4f4f5; padding: 40px 16px;">
        <div class="container" style="max-width: 595px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 28px rgba(222, 222, 222, 0.25);">

            <!-- Header -->
            <div class="header" style="text-align: center; padding: 32px 24px 24px; border-bottom: 3px solid #305DC9;">
                <img src="https://ik.imagekit.io/tmgaa5sb4/auth-logo.png?updatedAt=1765135203240" alt="Flipxer"
                    class="logo" style="width: 140px; height: auto;" width="140">
            </div>

            <div class="content" style="padding: 28px;">
                <!-- Amount Box -->
                <div class="amount-box" style="background-color: #f4f4f5; border: 2px solid #e1e4ea; border-radius: 12px; padding: 28px; text-align: center; margin-bottom: 24px;">
                    <div class="amount-label" style="color: #aaabac; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">{{header}}</div>
                    <p class="message" style="font-size: 16px; color: #020202; margin-bottom: 16px; line-height: 1.5;">{{notice}}</p>
                    <p class="sub-message" style="font-size: 14px; color: #5a5b5b; margin-bottom: 24px; line-height: 1.5;">For the full transaction breakdown and downloadable receipt, please sign in to your Flipxer account.</p>
                    <div style="text-align: center;">
                        <a href="https://app.flipxer.com/login" class="cta-button" style="background-color: #305DC9; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 6px; font-size: 14px; font-weight: 600; display: inline-block;">Sign in</a>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer" style="border-top: 3px solid #305DC9; padding: 24px; text-align: center;">
                <img src="https://ik.imagekit.io/tmgaa5sb4/auth-logo.png?updatedAt=1765135203240" alt="Flipxer"
                    class="footer-logo" style="width: 90px; height: auto; margin-bottom: 12px;" width="90">
                <p class="footer-text" style="color: #5a5b5b; font-size: 12px; margin: 0 0 6px;">hello@flipxer.com &bull; flipxer.com</p>
                <p class="footer-copyright" style="color: #aaabac; font-size: 11px; margin: 0;">&copy; 2026 Flipxer. All rights reserved.</p>
            </div>
        </div>
    </div>
</body>

</html>
