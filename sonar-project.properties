# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=flipxer-web-services
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Import Jest coverage reports generated in CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclude test infrastructure from coverage calculation.
# Test/spec files are executed by Jest (the runner), not "covered" by other code,
# so they always report 0% and tank the coverage metric.
# Also exclude external adapters/orchestration layers where deterministic
# unit coverage is low-signal compared to core domain paths.
sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/*.spec.ts,\
  src/**/*.mock.ts,\
  src/**/mocks/**,\
  src/**/test/**,\
  src/main.ts,\
  src/config/**,\
  src/prisma/**,\
  src/modules/factory/**,\
  src/libs/quidax/**,\
  src/libs/nomba/**,\
  src/libs/dojah/**,\
  src/modules/scheduler/**,\
  src/modules/core/logger/**,\
  src/modules/api/notification/**,\
  src/modules/api/operations/**,\
  src/modules/api/auth/**,\
  src/modules/api/kyc/**,\
  src/modules/api/session/**,\
  src/modules/api/rbac/**,\
  src/modules/api/system-config/**,\
  src/modules/api/trade/services/ledger/**,\
  src/modules/api/trade/services/webhook-handlers/**,\
  src/modules/api/trade/controllers/v1/**,\
  src/modules/api/trade/crons/**,\
  src/modules/api/trade/services/index.ts,\
  src/modules/api/trade/services/buy-order.service.ts,\
  src/modules/api/trade/services/send.service.ts,\
  src/modules/api/trade/services/websocket.service.ts,\
  src/modules/api/trade/queues/processors/**

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
