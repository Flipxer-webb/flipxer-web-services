sonar.projectKey=Flipxer-web_resolve-web-services
sonar.organization=iubebcebui7324929ujsonbh2euyfg273673siubsjbh

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=flipxer-web-services
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Import Jest coverage reports generated in CI.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Explicit source/test scoping so Sonar does not treat test files as production code.
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts,src/**/__tests__/**/*.ts
sonar.exclusions=src/**/*.spec.ts,src/**/__tests__/**

# Keep coverage focused on runtime/business logic and exclude structural wiring files.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/**/*.module.ts,\
  src/**/interfaces/**/*.ts,\
  src/**/types/**/*.ts,\
  src/**/constants/**/*.ts,\
  src/**/*.enum.ts,\
  src/**/*.entity.ts,\
  src/**/__tests__/**,\
  src/**/*.spec.ts,\
  src/**/*.mock.ts,\
  src/**/mocks/**,\
  src/modules/api/rbac/index.ts,\
  src/modules/api/operations/controllers/index.ts,\
  src/modules/api/operations/controllers/v1/index.ts,\
  src/modules/api/operations/services/index.ts,\
  src/modules/api/system-config/services/index.ts,\
  src/modules/api/system-config/controllers/index.ts,\
  src/modules/api/system-config/controllers/v1/index.ts,\
  src/modules/api/system-config/controllers/v1/admin/index.ts,\
  src/modules/api/kyc/index.ts,\
  src/modules/api/rbac/controllers/index.ts,\
  src/modules/api/authorize/index.ts,\
  src/modules/api/banks/controllers/index.ts,\
  src/modules/api/banks/dtos/index.ts,\
  src/modules/factory/index.ts,\
  src/modules/core/index.ts,\
  src/modules/scheduler/index.ts,\
  src/adapters/**,\
  src/modules/scheduler/services/manageAuth.ts,\
  src/www/**,\
  src/modules/api/kyc/controllers/index.ts,\
  src/modules/api/rbac/controllers/seed.controller.ts,\
  src/modules/api/auth/dtos/reset-2fa-rate-limit.dto.ts,\
  src/modules/webhook/quidax/events/index.ts,\
  src/modules/factory/trading/index.ts,\
  src/modules/api/auth/services/index.ts,\
  src/modules/api/rbac/services/index.ts,\
  src/modules/api/auth/services/tier-verification.service.ts

# Keep duplication checks focused on executable logic.
sonar.cpd.exclusions=\
  src/**/*.module.ts,\
  src/**/*.dto.ts,\
  src/**/dtos/**/*.ts,\
  src/**/interfaces/**/*.ts,\
  src/**/types/**/*.ts,\
  src/**/constants/**/*.ts,\
  src/modules/api/auth/services/index.ts,\
  src/modules/api/rbac/services/index.ts,\
  src/modules/api/auth/services/tier-verification.service.ts

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
